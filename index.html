<!DOCTYPE html>
<html lang="zh-Hant" class="scroll-smooth">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>2026 關西秋楓漫遊手帳｜11/27 - 12/01</title>

  <link href="https://fonts.googleapis.com/css2?family=Huninn&display=swap" rel="stylesheet" />
  <!-- 載入 Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            washi: '#FFFCF6',
            ink: '#3E3A39',
            coral: '#F2A497',
            yamabuki: '#F6D27A',
            mizu: '#A8D3E6',
            wakatake: '#B9DAA5',
          },
          fontFamily: {
            huninn: ['"Huninn"', 'sans-serif'],
          },
        },
      },
    };

  <style>
    /* 基礎繪本風格設定：和紙白底、3px墨灰粗線框、大圓角、平塗無漸層 */
    :root {
      --bg-washi: #FFFCF6;
      --ink: #3E3A39;
      --coral: #F2A497;
      --yamabuki: #F6D27A;
      --mizu: #A8D3E6;
      --wakatake: #B9DAA5;
    }

    body {
      background-color: var(--bg-washi);
      color: var(--ink);
      font-family: 'Huninn', sans-serif;
      background-image: radial-gradient(rgba(62, 58, 57, 0.06) 1px, transparent 0);
      background-size: 20px 20px;
      overflow-x: hidden;
    }

    .ehon-card {
      background-color: #FFFCF6;
      border: 3px solid #3E3A39;
      border-radius: 22px;
      box-shadow: 4px 4px 0px #3E3A39;
    }

    .ehon-card-sm {
      border: 3px solid #3E3A39;
      border-radius: 18px;
      box-shadow: 3px 3px 0px #3E3A39;
    }

    .ehon-btn {
      border: 3px solid #3E3A39;
      border-radius: 9999px;
      box-shadow: 3px 3px 0px #3E3A39;
      transition: transform 0.15s cubic-bezier(0.34, 1.56, 0.64, 1), box-shadow 0.15s ease;
    }

    .ehon-btn:active {
      transform: translate(2px, 2px);
      box-shadow: 1px 1px 0px #3E3A39;
    }

    .ehon-badge {
      border: 2.5px solid #3E3A39;
      border-radius: 9999px;
      box-shadow: 2px 2px 0px #3E3A39;
    }

    /* 機票左右半圓缺口 */
    .ticket-notch-left,
    .ticket-notch-right {
      position: absolute;
      width: 24px;
      height: 24px;
      background-color: #FFFCF6;
      border: 3px solid #3E3A39;
      border-radius: 50%;
      top: 50%;
      transform: translateY(-50%);
      z-index: 10;
    }
    .ticket-notch-left { left: -15px; }
    .ticket-notch-right { right: -15px; }

    /* 隱藏橫向捲軸 */
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

    /* 繪本插圖輕柔微動畫 */
    @keyframes floatCloud {
      0%, 100% { transform: translateX(0px); }
      50% { transform: translateX(8px); }
    }
    @keyframes floatCloudReverse {
      0%, 100% { transform: translateX(0px); }
      50% { transform: translateX(-7px); }
    }
    @keyframes swayLantern {
      0%, 100% { transform: rotate(-4deg); }
      50% { transform: rotate(4deg); }
    }
    @keyframes gentleBob {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-4px); }
    }
    @keyframes trainChug {
      0%, 100% { transform: translateY(0px) rotate(0deg); }
      25% { transform: translateY(-1.5px) rotate(0.4deg); }
      75% { transform: translateY(0px) rotate(-0.4deg); }
    }
    @keyframes leafDrift {
      0%, 100% { transform: translate(0px, 0px) rotate(0deg); }
      50% { transform: translate(4px, 5px) rotate(12deg); }
    }

    .anim-cloud { animation: floatCloud 5s ease-in-out infinite; }
    .anim-cloud-rev { animation: floatCloudReverse 6s ease-in-out infinite; }
    .anim-lantern { transform-origin: 50% 0%; animation: swayLantern 3.2s ease-in-out infinite; }
    .anim-bob { animation: gentleBob 3.5s ease-in-out infinite; }
    .anim-train { animation: trainChug 1.8s ease-in-out infinite; }
    .anim-leaf { animation: leafDrift 4.2s ease-in-out infinite; }

    @keyframes popBounceIn {
